name: NetCraftBR Preview Quality

on:
  push:
    branches:
      - redesign-mobile-solaris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies for isolated CI runner
        # bun.lock predates esbuild dependency update. Update only the
        # temporary runner lockfile; never commit dependency changes here.
        run: bun install
      - name: TypeScript typecheck
        run: npm run lint
      - name: Automated tests
        run: NODE_ENV=test npm test
      - name: Gate C - isolated verified HTTPS loopback (no external endpoint)
        env:
          NODE_ENV: test
          MERCADOPAGO_ACCESS_TOKEN: ""
          FIREBASE_SERVICE_ACCOUNT_JSON: ""
        run: node scripts/test-delivery-gate-c-https-loopback.mjs
      - name: Gate C.2 - isolated authenticated HTTPS local protocol (no deployment)
        env:
          NODE_ENV: test
          MERCADOPAGO_ACCESS_TOKEN: ""
          FIREBASE_SERVICE_ACCOUNT_JSON: ""
        run: node scripts/test-gate-c2-local-server.mjs
      - name: NetCraftCore BDS E2E synthetic HTTPS to executor contract (no production)
        env:
          NODE_ENV: test
          MERCADOPAGO_ACCESS_TOKEN: ""
          FIREBASE_SERVICE_ACCOUNT_JSON: ""
        run: |
          node --test minecraft/delivery-e2e-local/test-local-server.cjs minecraft/delivery-e2e-local/test-protocol.mjs
      - name: Phone UDP relay integration tests without BDS firewall changes
        run: |
          node --test minecraft/delivery-e2e-local/test-phone-udp-relay.cjs
          sha256sum minecraft/delivery-e2e-local/phone_udp_relay.cjs

      - name: Redmi LAN firewall helper — syntax and IPv4 complement safety
        shell: pwsh
        run: |
          $path = 'scripts/netcraft-delivery-phone-lan.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $source = Get-Content $path -Raw
          foreach ($required in @('NETCRAFT_PHONE_ACCESS_READY', 'NETCRAFT_PHONE_ACCESS_CLEANED', '192.168.1.2',
                                   '192.168.1.9', '19142', "Set-Remote `$out", "Set-Remote `$in",
                                   "Set-Remote `$out @('Any')", "Set-Remote `$in @('Any')")) {
            if (!$source.Contains($required)) { throw ('Missing firewall guard: ' + $required) }
          }
          foreach ($forbidden in @('Disable-NetFirewallRule', 'Set-NetFirewallProfile', 'Disable-NetFirewallProfile', 'netsh advfirewall set')) {
            if ($source.Contains($forbidden)) { throw ('Forbidden firewall operation: ' + $forbidden) }
          }
          Write-Host 'PASS: LAN helper syntax and rollback guards'
      - name: Redmi LAN firewall helper — IPv4 excludes phone and nothing else
        run: |
          python3 - <<'PY'
          import ipaddress,re
          text=open('scripts/netcraft-delivery-phone-lan.ps1').read()
          arr=text.split('$networks=@(',1)[1].split(')',1)[0]
          networks=re.findall(r"'([^']+)'",arr)
          assert len(networks)==33, networks
          ipv4=[ipaddress.ip_network(n) for n in networks if ':' not in n]
          assert len(ipv4)==32 and '::/0' in networks
          remaining=[ipaddress.ip_network('0.0.0.0/0')]
          phone=ipaddress.ip_address('192.168.1.2')
          expected=set(ipaddress.ip_network('0.0.0.0/0').address_exclude(ipaddress.ip_network('192.168.1.2/32')))
          assert set(ipv4)==expected, 'non-phone IPv4 coverage must be exact'
          assert all(phone not in n for n in ipv4), 'phone IP must not be explicitly blocked'
          print('PASS: only 192.168.1.2 is excepted from the BDS lab block rules')
          PY

      - name: Delivery E2E downloadable Windows script parser and fail-closed guards
        shell: pwsh
        run: |
          $file = 'scripts/netcraft-delivery-e2e-windows.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ('E2E PS1 parse failed: ' + ($errors | Out-String)) }
          $source = Get-Content $file -Raw
          foreach ($required in @('NETCRAFT_DELIVERY_E2E_PREPARED','NETCRAFT_DELIVERY_E2E_CLEANED',
                'Get-NetFirewallRule','force_tls','Get-FileHash','Cleanup',
                'NetCraftDeliveryE2E','CurrentUser','raw.githubusercontent.com')) {
            if (!$source.Contains($required)) { throw ('E2E missing guard: ' + $required) }
          }
          if ((Get-Item $file).Length -lt 4000) { throw 'E2E PS1 is truncated or empty' }
          Write-Host 'PASS: E2E PowerShell has valid syntax and mandatory safeguards'

      - name: Gate C.2 - PowerShell Windows lab syntax safety preflight
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/gate-c2-windows-lab.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ('PowerShell syntax errors: ' + ($errors | Out-String)) }
          $source = Get-Content scripts/gate-c2-windows-lab.ps1 -Raw
          foreach ($required in @('GateC2_Local', 'nc_gate_c2_synthetic_token', 'CurrentUser', 'force_tls', 'Cleanup', 'NetCraftGateC2')) {
            if (!$source.Contains($required)) { throw ('Gate C.2 Windows safety guard missing: ' + $required) }
          }
          Write-Host 'PASS: Gate C.2 Windows lab PowerShell parsed; scope and cleanup guards present'
      - name: Package and inspect OFF BDS preflight without deployment
        run: |
          set -euo pipefail
          node scripts/build-bds-preflight-off.mjs
          python3 - <<'PY'
          import json, zipfile
          path = "dist/bds-off/NetCraft_Delivery_Homologacao_OFF_v0.2.0.mcpack"
          expected = {
              "manifest.json",
              "scripts/main.js",
              "scripts/secretHeaderProbe.js",
              "scripts/capabilityInspection.js",
          }
          with zipfile.ZipFile(path) as pack:
              assert set(pack.namelist()) == expected, "Unexpected BDS package contents"
              manifest = json.loads(pack.read("manifest.json"))
              assert manifest["modules"][0]["entry"] == "scripts/main.js"
              assert manifest["modules"][0]["uuid"] == "99ac2e49-b003-46fc-8473-55700984acc7"
              entry = pack.read("scripts/main.js").decode()
              for forbidden in ("secretHeaderProbe", "http.request", "secrets.get", "runInterval", "runTimeout"):
                  assert forbidden not in entry, "BDS entrypoint is not inert"
              assert "modo OFF" in entry
          print("PASS: OFF-only BDS .mcpack archive inspected; no deployment")
          PY
      - name: Verify OFF mcpack using Windows-compatible PowerShell checker
        shell: pwsh
        run: |
          ./scripts/verify-bds-off-artifact.ps1 -PackPath "./dist/bds-off/NetCraft_Delivery_Homologacao_OFF_v0.2.0.mcpack"
      - name: Publish inert BDS OFF package for clone-only inspection
        uses: actions/upload-artifact@v4
        with:
          name: netcraft-delivery-bds-off-v020
          path: dist/bds-off/NetCraft_Delivery_Homologacao_OFF_v0.2.0.mcpack
          if-no-files-found: error
          retention-days: 7
      - name: Package and verify separate minimal Gate A OFF pack
        run: |
          set -euo pipefail
          node scripts/build-bds-gate-a-minimal.mjs
          python3 - <<'PY'
          import json,zipfile
          path="dist/bds-off/NetCraft_Delivery_GateA_Minimal_OFF_v0.2.1.mcpack"
          with zipfile.ZipFile(path) as z:
              assert sorted(z.namelist()) == ["manifest.json","scripts/main.js"]
              m=json.loads(z.read("manifest.json"))
              s=z.read("scripts/main.js").decode()
              assert m["header"]["uuid"]=="91bc21f7-a701-4f06-9785-7126cbdb67f1"
              assert m["modules"][0]["uuid"]=="16f58c35-975f-45ac-a512-85f282b7ea45"
              assert m["dependencies"]==[{"module_name":"@minecraft/server","version":"1.17.0"}]
              assert "system.run" in s and "MINIMAL OFF loaded" in s
              for forbidden in ("server-net","server-admin","http.request","secrets.get","runCommand","fetch(","eval("):
                  assert forbidden not in s
          print("PASS: two-file Gate A minimal OFF pack inspected")
          PY
      - name: Publish separate Gate A minimal OFF archive
        uses: actions/upload-artifact@v4
        with:
          name: netcraft-gate-a-minimal-off-v021
          path: dist/bds-off/NetCraft_Delivery_GateA_Minimal_OFF_v0.2.1.mcpack
          if-no-files-found: error
          retention-days: 7
      - name: Build storefront
        run: npm run build

  pix-firestore-emulator:
    name: Pix Firestore emulator (demo only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_ENV: test
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      GCLOUD_PROJECT: demo-netcraft-admin-test
      GOOGLE_CLOUD_PROJECT: demo-netcraft-admin-test
      FIREBASE_PROJECT_ID: demo-netcraft-admin-test
      FIREBASE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      MERCADOPAGO_ACCESS_TOKEN: ""
      MERCADOPAGO_WEBHOOK_SECRET: ""
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run isolated Firestore emulator integration
        shell: bash
        run: |
          set -euo pipefail
          test "$FIRESTORE_EMULATOR_HOST" = "127.0.0.1:8085"
          test "$GCLOUD_PROJECT" = "demo-netcraft-admin-test"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$MERCADOPAGO_ACCESS_TOKEN"
          cat > /tmp/netcraft-firebase-emulator.json <<'JSON'
          {
            "firestore": {"rules": "firestore.rules"},
            "emulators": {
              "firestore": {"host": "127.0.0.1", "port": 8085},
              "ui": {"enabled": false}
            }
          }
          JSON
          # Config lives in the checkout so its relative rules path resolves.
          cp /tmp/netcraft-firebase-emulator.json .firebase-emulator-ci.json
          npx --yes firebase-tools@14 emulators:exec --only firestore \
            --project demo-netcraft-admin-test \
            --config .firebase-emulator-ci.json \
            'node --import tsx tests/pix-emulator.integration.ts'
